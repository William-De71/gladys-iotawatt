<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14263a"/>
      <stop offset="1" stop-color="#22405e"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#c9d3dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>
  <!-- the electrical panel -->
  <rect x="300" y="210" width="250" height="280" rx="16" fill="#2b4664" stroke="#5f7d9c" stroke-width="3"/>
  <g fill="#e8eef4" stroke="#8796a5" stroke-width="2">
    <rect x="322" y="236" width="34" height="62" rx="4"/>
    <rect x="364" y="236" width="34" height="62" rx="4"/>
    <rect x="406" y="236" width="34" height="62" rx="4"/>
    <rect x="448" y="236" width="34" height="62" rx="4"/>
    <rect x="490" y="236" width="34" height="62" rx="4"/>
  </g>
  <g fill="#f28c28">
    <rect x="333" y="250" width="12" height="18" rx="2"/>
    <rect x="375" y="250" width="12" height="18" rx="2"/>
    <rect x="417" y="250" width="12" height="18" rx="2"/>
    <rect x="459" y="250" width="12" height="18" rx="2"/>
    <rect x="501" y="250" width="12" height="18" rx="2"/>
  </g>
  <!-- the wires and their CT clamps -->
  <g stroke="#9fb3c8" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M339 298 V370"/>
    <path d="M381 298 V370"/>
    <path d="M423 298 V370"/>
    <path d="M465 298 V370"/>
  </g>
  <g fill="none" stroke="#7fd0ff" stroke-width="7">
    <circle cx="339" cy="336" r="13"/>
    <circle cx="381" cy="336" r="13"/>
    <circle cx="423" cy="336" r="13"/>
    <circle cx="465" cy="336" r="13"/>
  </g>
  <!-- the IoTaWatt box -->
  <rect x="320" y="388" width="210" height="80" rx="12" fill="url(#box)" stroke="#8796a5" stroke-width="2"/>
  <circle cx="346" cy="428" r="8" fill="#3fbf6f"/>
  <g fill="#8796a5">
    <rect x="372" y="414" width="12" height="28" rx="3"/>
    <rect x="392" y="414" width="12" height="28" rx="3"/>
    <rect x="412" y="414" width="12" height="28" rx="3"/>
    <rect x="432" y="414" width="12" height="28" rx="3"/>
    <rect x="452" y="414" width="12" height="28" rx="3"/>
    <rect x="472" y="414" width="12" height="28" rx="3"/>
    <rect x="492" y="414" width="12" height="28" rx="3"/>
  </g>
  <!-- Wi-Fi to the readings -->
  <g stroke="#7fc4ff" stroke-width="5" fill="none" stroke-dasharray="12 9" stroke-linecap="round">
    <path d="M532 405 C556 398 570 384 576 366"/>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold">
    <rect x="580" y="214" width="190" height="62" rx="14" fill="#ffffff" opacity="0.12"/>
    <text x="598" y="258" font-size="34" fill="#f7c968">2.4 kW</text>
    <rect x="580" y="290" width="190" height="62" rx="14" fill="#ffffff" opacity="0.12"/>
    <text x="598" y="334" font-size="34" fill="#7fd0ff">12 kWh</text>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#ffffff">
    <text x="40" y="96" font-size="64" font-weight="bold">IoTaWatt</text>
    <text x="42" y="142" font-size="28">for Gladys Assistant</text>
    <text x="42" y="182" font-size="20" fill="#cfe3f5">power · energy · voltage, circuit by circuit</text>
  </g>
</svg>
